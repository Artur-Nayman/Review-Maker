<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Maker - Set Password</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/>
            <path d="M9 14l2 2 4-4"/>
          </svg>
        </div>
        <h1>Set Your Password</h1>
        <p id="set-password-name">Loading...</p>
      </div>

      <div id="set-password-error" class="error-msg" style="display: none;"></div>
      <div id="set-password-success" class="success-msg" style="display: none;"></div>

      <form id="set-password-form" style="display: none;">
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" placeholder="Min 4 characters" required minlength="4">
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Repeat password" required minlength="4">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Set Password</button>
      </form>

      <div id="set-password-invalid" style="display: none;">
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 1rem;">This link is invalid or has expired.</p>
        <p style="text-align: center; color: var(--text-muted); font-size: 0.875rem;">Contact your admin for a new link.</p>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const name = params.get('name');

    if (!token || !name) {
      document.getElementById('set-password-invalid').style.display = 'block';
    } else {
      document.getElementById('set-password-name').textContent = decodeURIComponent(name);

      document.getElementById('set-password-form').style.display = 'block';

      document.getElementById('set-password-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('set-password-error');
        const successEl = document.getElementById('set-password-success');
        errorEl.style.display = 'none';
        successEl.style.display = 'none';

        const password = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;

        if (password !== confirm) {
          errorEl.textContent = 'Passwords do not match';
          errorEl.style.display = 'block';
          return;
        }

        try {
          const res = await fetch('/api/set-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, name: decodeURIComponent(name), password })
          });

          const data = await res.json();

          if (!res.ok) {
            errorEl.textContent = data.error;
            errorEl.style.display = 'block';
            return;
          }

          successEl.textContent = 'Password set! Redirecting to login...';
          successEl.style.display = 'block';
          document.getElementById('set-password-form').style.display = 'none';

          setTimeout(() => {
            window.location.href = '/login.html';
          }, 2000);
        } catch (err) {
          errorEl.textContent = 'Connection error';
          errorEl.style.display = 'block';
        }
      });
    }
  </script>
</body>
</html>
