<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Maker - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/>
            <path d="M9 14l2 2 4-4"/>
          </svg>
        </div>
        <h1>Review Maker</h1>
        <p>Select your account to continue</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="user-select">Your Name</label>
          <select id="user-select" required>
            <option value="">-- Select your name --</option>
          </select>
        </div>

        <div class="form-group" id="password-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password">
          <span id="password-hint" class="help-text" style="display: none;">Password required for this account</span>
        </div>

        <div id="login-error" class="error-msg" style="display: none;"></div>

        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      </form>

      <div class="login-footer">
        <span>v2.1.0</span>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
